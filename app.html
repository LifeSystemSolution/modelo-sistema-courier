  <title>LifeCargo · Sistema de envíos</title>
  <meta name="theme-color" content="#0a0a0a">
  <meta name="description" content="Demo del sistema interno de LifeCargo Express: recepción, despacho, reparto, riesgo de retraso y reportes. Datos ficticios.">

<body>
  <div id="selector" class="selector" hidden></div>

  <div class="app">
    <aside class="side">
      <a class="marca" id="side-logo" href="web.html" aria-label="LifeCargo, ir a la web de la empresa"></a>
      <nav id="nav" class="nav" aria-label="Secciones"></nav>
      <div class="side-pie">
        <div class="side-user" id="side-user"></div>
        <button type="button" class="side-btn" id="btn-salir">Cambiar de rol</button>
      </div>
    </aside>

    <div class="main" id="main">
      <header class="top">
        <h1 id="titulo">LifeCargo</h1>
        <div class="top-acc">
          <a class="top-plan" id="plan-pill" href="index.html#planes" title="Ver y cambiar de plan"></a>
          <button type="button" class="btn btn-line btn-sm" id="btn-sim" hidden title="Registra un envío de ejemplo en el counter de Lima">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
            <span>Simular envío</span>
          </button>
          <button type="button" class="btn btn-ghost btn-icon btn-sm hide-m" id="btn-atajos" aria-label="Atajos de teclado">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.5M10 10h.5M14 10h.5M18 10h.5M7 14h10"/></svg>
          </button>
          <button type="button" class="btn btn-ghost btn-icon btn-sm" id="btn-tema" aria-label="Cambiar tema"></button>
        </div>
      </header>
      <p class="demo-aviso">Demo con datos ficticios · SUNAT, RENIEC, WhatsApp y firma del cliente simulados</p>
      <main id="vista" class="vista"></main>
    </div>

    <nav id="tabbar" class="tabbar" aria-label="Secciones"></nav>
  </div>

  <!-- Orden de carga: íconos → motor → planes → datos → interfaz → módulos → arranque -->
  <script src="js/icons.js?v=4"></script>
  <script src="js/motor.js?v=4"></script>
  <script src="js/planes.js?v=4"></script>
  <script src="js/seed.js?v=4"></script>
  <script src="js/store.js?v=4"></script>
  <script src="js/ui.js?v=4"></script>
  <script src="js/envios.js?v=4"></script>
  <script src="js/recepcion.js?v=4"></script>
  <script src="js/agencia.js?v=4"></script>
  <script src="js/caja.js?v=4"></script>
  <script src="js/clientes.js?v=4"></script>
  <script src="js/reparto.js?v=4"></script>
  <script src="js/manifiestos.js?v=4"></script>
  <script src="js/tablero.js?v=4"></script>
  <script src="js/reportes.js?v=4"></script>
  <script src="js/extras.js?v=4"></script>
  <script src="js/ajustes.js?v=4"></script>
  <script src="js/app.js?v=4"></script>
