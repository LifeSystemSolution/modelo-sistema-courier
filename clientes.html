<!DOCTYPE html>
<html lang="es">
<head><!-- Google tag (gtag.js) --><script async src="https://www.googletagmanager.com/gtag/js?id=G-7KMKZ8F317"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag("js",new Date());gtag("config","G-7KMKZ8F317");</script>
<meta charset="UTF-8">
<title>LifeCargo Express S.A.C. | Sistema de Gestión de Envíos</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand"></div>
    <a href="dashboard.html">Dashboard</a>
    <a class="active" href="clientes.html">Clientes</a>
    <a href="envios.html">Envíos</a>
    <a href="tracking.html">Seguimiento</a>
    <a href="reportes.html">Reportes</a>
    <a href="configuracion.html">Configuración</a>
    <a href="usuarios.html" data-admin-only>Usuarios</a>
  </aside>
  <main class="main">
    <div class="topbar"><div><h3>Clientes</h3><div class="user-meta">Usuario: <strong id="usuarioNombre">...</strong></div></div><button onclick="logout()" class="btn btn-outline-danger">Salir</button></div>

    <div class="surface p-3 mb-3">
      <h6>Nuevo cliente</h6>
      <div class="row g-2 mb-2">
        <div class="col-md-4"><label class="form-label">Tipo de cliente</label><select id="tipoCliente" class="form-select"><option value="natural">Persona Natural</option><option value="empresa">Empresa</option></select></div>
      </div>
      <div id="formNatural" class="row g-2">
        <div class="col-md-4"><input id="nombres" class="form-control" placeholder="Nombres *"></div>
        <div class="col-md-4"><input id="apellidoPaterno" class="form-control" placeholder="Apellido paterno *"></div>
        <div class="col-md-4"><input id="apellidoMaterno" class="form-control" placeholder="Apellido materno *"></div>
        <div class="col-md-3"><input id="dni" class="form-control" inputmode="numeric" maxlength="8" placeholder="DNI (8 dígitos) *"></div>
        <div class="col-md-3"><input id="telefonoNatural" class="form-control" inputmode="numeric" maxlength="9" placeholder="Teléfono (9 dígitos) *"></div>
        <div class="col-md-3"><input id="correoNatural" type="email" class="form-control" placeholder="Correo electrónico"></div>
        <div class="col-md-3"><input id="direccionNatural" class="form-control" placeholder="Dirección"></div>
      </div>
      <div id="formEmpresa" class="row g-2 d-none">
        <div class="col-md-4"><input id="razonSocial" class="form-control" placeholder="Razón Social *"></div>
        <div class="col-md-3"><input id="ruc" class="form-control" inputmode="numeric" maxlength="11" placeholder="RUC (11 dígitos) *"></div>
        <div class="col-md-3"><input id="telefonoEmpresa" class="form-control" inputmode="numeric" maxlength="9" placeholder="Teléfono (9 dígitos) *"></div>
        <div class="col-md-4"><input id="correoEmpresa" type="email" class="form-control" placeholder="Correo"></div>
        <div class="col-md-6"><input id="direccionEmpresa" class="form-control" placeholder="Dirección"></div>
      </div>
      <div class="mt-3"><button onclick="guardarCliente()" class="btn btn-primary">Guardar cliente</button></div>
    </div>

    <div class="surface p-3">
      <div class="d-flex justify-content-between gap-2 flex-wrap mb-3"><h6 class="mb-0">Listado de clientes</h6><input id="buscarCliente" class="form-control w-auto flex-grow-1" placeholder="Buscar por nombre, apellido, razón social, DNI, RUC o teléfono"></div>
      <ul id="lista" class="list-group"></ul>
    </div>
  </main>
</div>
<script type="module" src="js/logo.js"></script>
<script type="module" src="js/guard.js"></script><script type="module" src="js/clientes.js"></script><script type="module" src="js/accessibility.js"></script>
</body>
</html>
