<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>LifeCargo Express S.A.C. | Almacenes</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<div class="layout">
  <aside class="sidebar"><div class="brand"></div></aside>
  <main class="main">
    <div class="topbar"><div><h3>Administración de almacenes</h3><div class="user-meta">Usuario: <strong id="usuarioNombre">...</strong></div></div><button onclick="logout()" class="btn btn-outline-danger">Salir</button></div>
    <div id="adminOnlyContent" class="d-none">
      <div class="surface p-3 mb-3">
        <h6><i class="bi bi-building"></i> Crear almacén</h6>
        <div class="row g-2 mb-3">
          <div class="col-md-3"><input id="almacenNombre" class="form-control" placeholder="Nombre *"></div>
          <div class="col-md-3"><input id="almacenCiudad" class="form-control" placeholder="Ciudad *"></div>
          <div class="col-md-4"><input id="almacenDireccion" class="form-control" placeholder="Dirección *"></div>
          <div class="col-md-2"><select id="almacenEstado" class="form-select"><option value="ACTIVO">Activo</option><option value="INACTIVO">Inactivo</option></select></div>
          <div class="col-md-3 d-grid"><button onclick="guardarAlmacen()" class="btn btn-primary">Guardar almacén</button></div>
        </div>
      </div>
      <div class="surface p-3"><h6>Almacenes</h6><div class="table-responsive"><table class="table table-sm"><thead><tr><th>Nombre</th><th>Ciudad</th><th>Dirección</th><th>Estado</th><th>Acción</th></tr></thead><tbody id="tablaAlmacenes"></tbody></table></div></div>
    </div>
    <div id="noAdmin" class="alert alert-warning d-none">Este módulo solamente es visible para Administración.</div>
  </main>
</div>
<script type="module" src="js/logo.js"></script><script type="module" src="js/guard.js"></script><script type="module" src="js/almacenes.js"></script><script type="module" src="js/accessibility.js"></script>
</body>
</html>
