<!DOCTYPE html>
<html lang="es">
<head><!-- Google tag (gtag.js) --><script async src="https://www.googletagmanager.com/gtag/js?id=G-7KMKZ8F317"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag("js",new Date());gtag("config","G-7KMKZ8F317");</script>
<meta charset="UTF-8">
<title>LifeCargo Express S.A.C. | Sistema de Gestión de Envíos</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="auth-page">

<div class="auth-shell">
  <div class="card auth-card p-4 text-center">
    <img src="assets/logo/logo.png" onerror="this.onerror=function(){this.onerror=null;this.src='assets/logo/placeholder.svg';};this.src='assets/logo/logo.svg';" class="login-logo mx-auto mb-3" alt="Logo LifeCargo Express S.A.C.">

    <div class="login-brand mb-4">
      <h1>LifeCargo Express S.A.C.</h1>
      <p>RUC: 20000000000</p>
      <span>Sistema de Gestión de Envíos</span>
    </div>

    <div id="loginBox">
      <h4 class="mb-3">Iniciar sesión</h4>
      <input id="loginEmail" class="form-control mb-2" placeholder="Correo electrónico">
      <input id="loginPassword" type="password" class="form-control mb-3" placeholder="Contraseña">
      <button onclick="login()" class="btn btn-primary w-100">Iniciar sesión</button>
      <button id="crearSuperAdminBtn" onclick="mostrarFormularioSuperAdmin()" class="btn btn-outline-dark w-100 mt-2 d-none">⚙ Crear Super Administrador</button>

    </div>

    <div id="superAdminBox" class="surface text-start mt-3 d-none">
      <h5 class="mb-3 text-center">Crear Super Administrador</h5>
      <div class="row g-2">
        <div class="col-md-12"><input id="saNombres" class="form-control" placeholder="Nombres *"></div>
        <div class="col-md-6"><input id="saApellidoPaterno" class="form-control" placeholder="Apellido paterno *"></div>
        <div class="col-md-6"><input id="saApellidoMaterno" class="form-control" placeholder="Apellido materno *"></div>
        <div class="col-md-6"><input id="saDni" class="form-control" inputmode="numeric" maxlength="8" placeholder="DNI *"></div>
        <div class="col-md-6"><input id="saTelefono" class="form-control" inputmode="numeric" maxlength="9" placeholder="Teléfono *"></div>
        <div class="col-md-12"><input id="saCorreo" type="email" class="form-control" placeholder="Correo electrónico *"></div>
        <div class="col-md-6"><input id="saPassword" type="password" class="form-control" placeholder="Contraseña *"></div>
        <div class="col-md-6"><input id="saConfirmar" type="password" class="form-control" placeholder="Confirmar contraseña *"></div>
        <div class="col-md-6"><input id="saEmpresa" class="form-control" value="LifeCargo Express S.A.C." placeholder="Empresa *"></div>
        <div class="col-md-6"><input id="saRuc" class="form-control" value="20000000000" placeholder="RUC *"></div>
        <div class="col-12 d-grid"><button onclick="crearSuperAdmin()" class="btn btn-dark">Crear y entrar al sistema</button></div>
      </div>
    </div>

    <div class="alert alert-warning small text-start mb-0 mt-3">
      <strong>Versión demo</strong> — datos ficticios guardados solo en tu navegador. Contraseña para todos: <code>demo123</code>
      <div class="d-grid gap-1 mt-2">
        <button type="button" class="btn btn-sm btn-outline-dark" onclick="demoLogin('admin@lifecargo.demo')">Entrar como Administrador</button>
        <button type="button" class="btn btn-sm btn-outline-dark" onclick="demoLogin('operador@lifecargo.demo')">Entrar como Operador de almacén</button>
        <button type="button" class="btn btn-sm btn-outline-dark" onclick="demoLogin('transportista@lifecargo.demo')">Entrar como Transportista</button>
        <button type="button" class="btn btn-sm btn-link text-muted" onclick="resetDemo()">Reiniciar datos de la demo</button>
      </div>
    </div>
    <script>
      window.demoLogin = (email) => {
        document.getElementById("loginEmail").value = email;
        document.getElementById("loginPassword").value = "demo123";
        window.login();
      };
    </script>
  </div>
</div>

<script type="module" src="js/logo.js"></script>
<script type="module" src="js/auth.js"></script>



<script type="module" src="js/accessibility.js"></script>
</body>
</html>
