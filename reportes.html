<!DOCTYPE html>
<html lang="es">
<head><!-- Google tag (gtag.js) --><script async src="https://www.googletagmanager.com/gtag/js?id=G-7KMKZ8F317"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag("js",new Date());gtag("config","G-7KMKZ8F317");</script>
<meta charset="UTF-8">
<title>LifeCargo Express S.A.C. | Sistema de Gestión de Envíos</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand"></div>
    <a href="dashboard.html">Dashboard</a>
    <a href="clientes.html">Clientes</a>
    <a href="envios.html">Envíos</a>
    <a href="tracking.html">Seguimiento</a>
    <a class="active" href="reportes.html">Reportes</a>
    <a href="configuracion.html">Configuración</a>
    <a href="usuarios.html" data-admin-only>Usuarios</a>
  </aside>

  <main class="main"><img src="assets/logo/logo.png" onerror="this.onerror=function(){this.onerror=null;this.src='assets/logo/placeholder.svg';};this.src='assets/logo/logo.svg';" class="page-logo mb-3" alt="Logo LifeCargo Express S.A.C.">
    <div class="topbar">
      <div>
        <h3>Reportes</h3>
        <div class="user-meta">Usuario: <strong id="usuarioNombre">...</strong></div>
      </div>
      <button onclick="logout()" class="btn btn-outline-danger">Salir</button>
    </div>

    <div class="surface p-3 mb-3">
      <h6 class="mb-3">Filtros</h6>
      <div class="row g-2 align-items-end">
        <div class="col-12 col-md-3">
          <label for="fechaDesde" class="form-label mb-1">Fecha desde</label>
          <input id="fechaDesde" type="date" class="form-control">
        </div>
        <div class="col-12 col-md-3">
          <label for="fechaHasta" class="form-label mb-1">Fecha hasta</label>
          <input id="fechaHasta" type="date" class="form-control">
        </div>
        <div class="col-12 col-md-3">
          <label for="filtroEstado" class="form-label mb-1">Estado</label>
          <select id="filtroEstado" class="form-select">
            <option value="">Todos</option>
            <option value="recibido">Recibido</option><option value="almacen_origen">Almacén Origen</option><option value="en_ruta">En Ruta</option><option value="almacen_destino">Llegó Almacén Destino</option><option value="pendiente_entrega">Pendiente de Entrega</option><option value="entregado">Entregado</option><option value="entrega_confirmada">Entrega Confirmada</option><option value="anulado">Anulado</option>
          </select>
        </div>
        <div class="col-12 col-md-3">
          <label for="filtroCliente" class="form-label mb-1">Cliente</label>
          <select id="filtroCliente" class="form-select">
            <option value="">Todos</option>
          </select>
        </div>
      </div><div class="row g-2 mt-2"><div class="col-md-3"><input id="filtroTexto" class="form-control" placeholder="Cliente, empresa, DNI, RUC"></div><div class="col-md-3"><input id="filtroCiudad" class="form-control" placeholder="Ciudad"></div><div class="col-md-3"><input id="filtroTransportista" class="form-control" placeholder="Transportista"></div><div class="col-md-3"><select id="tipoReporte" class="form-select"><option value="">Reporte general</option><option value="diario">Reporte Diario</option><option value="mensual">Reporte Mensual</option><option value="en_ruta">Reporte En Ruta</option><option value="pendientes">Reporte Pendientes</option><option value="entregados">Reporte Entregados</option></select></div></div>
    </div>

    <div class="surface p-3 mb-3">
      <div class="d-flex gap-2 flex-wrap">
        <button onclick="exportExcel()" class="btn btn-success">Exportar Excel</button>
        <button onclick="exportPDF()" class="btn btn-danger">Exportar PDF</button>
      </div>
    </div>

    <div class="surface p-3 mb-3">
      <h6 class="mb-3">Tabla de envíos</h6>
      <div class="table-responsive">
        <table class="table table-striped align-middle mb-0">
          <thead>
            <tr>
              <th>Código</th>
              <th>Cliente</th>
              <th>Descripción</th>
              <th>Estado</th>
              <th>Fecha</th><th>Ciudad</th><th>Transportista</th>
            </tr>
          </thead>
          <tbody id="tabla"></tbody>
        </table>
      </div>
    </div>

    <div class="surface p-3">
      <h6 class="mb-3">Distribución por estado</h6>
      <div class="chart-box mx-auto" style="max-width: 420px; height: 320px;">
        <canvas id="grafico"></canvas>
      </div>
    </div>
  </main>
</div>

<script type="module" src="js/logo.js"></script>
<script type="module" src="js/guard.js"></script>
<script type="module" src="js/reportes.js"></script>
<script type="module" src="js/accessibility.js"></script>
</body>
</html>
