<link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script></head><body><div class="layout"><aside class="sidebar">

  </aside><main class="main"><div class="topbar"><div><h3>Gestión de envíos</h3><div class="user-meta">Usuario: <strong id="usuarioNombre">...</strong></div></div><button onclick="logout()" class="btn btn-outline-danger">Salir</button></div>
<div class="surface p-3 mb-3"><h5 class="mb-3"><i class="bi bi-box-seam"></i> Crear envío</h5>
  <div class="form-section"><h6><i class="bi bi-person-vcard"></i> Cliente</h6><div class="row g-2 align-items-end"><div class="col-md-6 position-relative"><label class="form-label">Cliente *</label><input id="clienteBuscar" class="form-control" placeholder="Buscar por nombre, apellido, razón social, DNI, RUC o teléfono" autocomplete="off"><div id="clienteResultados" class="search-results d-none"></div><input id="clienteId" type="hidden"><div id="clienteSeleccionado" class="small text-muted mt-1">Sin cliente seleccionado.</div></div><div class="col-md-3"><label class="form-label">Fecha ingreso</label><input id="fechaIngreso" type="date" class="form-control" readonly disabled></div><div class="col-md-3"><label class="form-label">Fecha estimada llegada *</label><input id="fechaEstimadaLlegada" type="date" class="form-control" required></div></div></div>
  <div class="form-section"><h6><i class="bi bi-geo-alt"></i> Destino</h6><div class="row g-2"><div class="col-md-3"><select id="almacenOrigen" class="form-select"><option value="">Almacén origen *</option></select></div><div class="col-md-3"><select id="almacenDestino" class="form-select"><option value="">Almacén destino *</option></select></div><div class="col-md-3"><input id="transportistaNombre" class="form-control" placeholder="Transportista asignado"></div><div class="col-md-3"><input id="transportistaId" class="form-control" placeholder="ID transportista"></div><div class="col-md-3"><input id="destinatarioNombres" class="form-control" placeholder="Nombres destinatario *"></div><div class="col-md-3"><input id="destinatarioApellidoPaterno" class="form-control" placeholder="Apellido paterno *"></div><div class="col-md-3"><input id="destinatarioApellidoMaterno" class="form-control" placeholder="Apellido materno *"></div><div class="col-md-3"><input id="destinatarioTelefono" class="form-control" maxlength="9" inputmode="numeric" placeholder="Teléfono *"></div><div class="col-md-12"><input id="destinatarioDireccion" class="form-control" placeholder="Dirección *"></div></div></div>
  <div class="form-section mb-0"><h6><i class="bi bi-truck"></i> Información del envío</h6><div class="row g-2"><div class="col-md-2"><input id="cantidadPaquetes" type="number" min="1" value="1" class="form-control" placeholder="Cantidad *"></div><div class="col-md-4"><input id="descripcion" class="form-control" placeholder="Descripción obligatoria *"></div><div class="col-md-2"><input id="precio" type="number" step="0.01" min="0" class="form-control" placeholder="Precio opcional"></div><div class="col-md-2"><input id="peso" type="number" step="0.01" min="0" class="form-control" placeholder="Peso opcional"></div><div class="col-md-2"><input id="observaciones" class="form-control" placeholder="Observaciones"></div><div class="col-md-2 d-grid"><button onclick="crearEnvio()" class="btn btn-primary"><i class="bi bi-save"></i> Guardar</button></div></div></div></div>
<div class="surface p-3 mb-3"><h6>Filtros de envíos</h6><div class="row g-2"><div class="col-md-6"><input id="busquedaEnvio" class="form-control" placeholder="Buscar por código, cliente, documento, destinatario o descripción"></div><div class="col-md-3"><input id="filtroFechaEnvio" type="date" class="form-control"></div><div class="col-md-2 d-grid"><button id="limpiarFiltros" class="btn btn-outline-secondary">Limpiar</button></div></div></div><div id="enviosBoard" class="row g-3"></div></main></div><script type="module" src="js/logo.js"></script>
<script type="module" src="js/guard.js"></script><script type="module" src="js/envios.js"></script><script type="module" src="js/accessibility.js"></script></body></html>
